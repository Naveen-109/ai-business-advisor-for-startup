<!DOCTYPE html>
<html>
<head>
    <title>Test Karnataka Integration</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #response { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; white-space: pre-wrap; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>🏛️ Karnataka Business Ideas Test</h1>
    <p>Click any button to test Karnataka district integration:</p>
    
    <button onclick="testQuery('Give me business ideas for Mysuru')">Mysuru</button>
    <button onclick="testQuery('Tourism business ideas for Kodagu')">Kodagu Tourism</button>
    <button onclick="testQuery('Business opportunities in Bangalore')">Bangalore</button>
    <button onclick="testQuery('Agriculture ideas for Mandya')">Mandya Agriculture</button>
    <button onclick="testQuery('Food business in Udupi')">Udupi Food</button>
    
    <div id="response"></div>
    
    <script>
        async function testQuery(message) {
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = '<p class="loading">Loading...</p>';
            
            try {
                const response = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                responseDiv.innerHTML = `<strong>Query:</strong> ${message}\n\n<strong>Response:</strong>\n${data.response}`;
            } catch (error) {
                responseDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>
