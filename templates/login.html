<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - AI Business Advisor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='extra/login.css') }}">
</head>
<body>
  <div class="login-container">
    <div class="card">
      <h2>AI Business Advisor</h2>
      <p class="lead">Sign in to save your data and chat history</p>

      <div id="messages">{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}</div>

      <div class="form-switch">
        <button id="showLogin" class="active">Login</button>
        <button id="showRegister">Register</button>
      </div>

      <form id="loginForm" method="post" action="{{ url_for('login') }}">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit" class="primary">Sign in</button>
      </form>

      <form id="registerForm" method="post" action="{{ url_for('register') }}" class="hidden">
        <input name="username" placeholder="Choose a username" required>
        <input name="password" type="password" placeholder="Choose a password" required>
        <input name="email" type="email" placeholder="Email (optional)">
        <button type="submit" class="primary">Create account</button>
      </form>

      <div class="note">
        <a href="{{ url_for('index') }}">Continue without login</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='extra/login.js') }}"></script>
</body>
</html>
